<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserva de piscina</title>
<style>
:root{--bg:#eef6f6;--card:#fff;--ink:#12303a;--mute:#5d7a82;--line:#cfe2e3;--water:#0f6f7c;--water-ink:#fff;--taken:#e3eaec;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a1e;--card:#14272d;--ink:#e6f2f3;--mute:#8fb0b6;--line:#244149;--water:#3fb5c4;--water-ink:#06242a;--taken:#1c343b;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:block;font:600 .85rem system-ui,sans-serif;margin:12px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font:1rem system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:600 .95rem system-ui,sans-serif;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;background:var(--water);color:var(--water-ink)}
button.sec{background:transparent;color:var(--water);border:1px solid var(--water)}
button.link{background:none;color:var(--water);padding:4px;text-decoration:underline}
button:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.full{width:100%;margin-top:16px}
.msg{min-height:1.3em;margin:10px 0 0;font:.9rem system-ui,sans-serif;color:var(--err)}
.msg.ok{color:var(--water)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font:.9rem system-ui,sans-serif;color:var(--mute);margin-bottom:12px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);border-left:6px solid var(--water)}
.slot strong{font:700 1rem system-ui,sans-serif;white-space:nowrap}
.slot .who{flex:1;text-align:right;font:.9rem system-ui,sans-serif}
.slot.taken{background:var(--taken);border-left-color:var(--mute)}
.slot.mine{background:color-mix(in srgb,var(--water) 14%,var(--card))}
.slot.past{opacity:.5}
.hidden{display:none}
.adm{margin-top:24px}
.adm h2{font-size:1.2rem;margin:0 0 4px}
.tabla{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font:.85rem system-ui,sans-serif}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ayuda{font:.8rem system-ui,sans-serif;color:var(--mute);margin:4px 0 0}
</style>
</head>
<body>
<main>
  <h1>Piscina: reservas</h1>
  <p class="sub">Turnos de 1 hora, de 09:00 a 18:00. Los horarios tomados se actualizan al instante.</p>

  <section id="auth" class="card">
    <div id="extra" class="hidden">
      <label for="nombre">Nombre y apellido</label>
      <input id="nombre" autocomplete="name" maxlength="60">
      <label for="casa">Casa o apartamento</label>
      <input id="casa" maxlength="20">
      <label for="alias">Alias (es lo único que verán los demás)</label>
      <input id="alias" maxlength="20">
    </div>
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="email">
    <label for="pass">Contraseña (mínimo 6 caracteres)</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button id="go" class="full">Ingresar</button>
    <p id="amsg" class="msg" role="status"></p>
    <button id="modo" class="link">¿Primera vez? Crear cuenta</button>
  </section>

  <section id="app" class="hidden">
    <div class="top"><span id="quien"></span><button id="salir" class="sec">Salir</button></div>
    <label for="dia">Día</label>
    <input id="dia" type="date">
    <div id="slots" style="margin-top:14px"></div>
    <p id="msg" class="msg" role="status"></p>

    <section id="admin" class="card adm hidden">
      <h2>Listado del día (administrador)</h2>
      <p class="ayuda">Solo tú ves los nombres completos. Cambia el día arriba para ver otras fechas.</p>
      <div class="tabla"><table>
        <thead><tr><th>Hora</th><th>Nombre</th><th>Casa</th><th>Correo</th><th>Alias</th><th></th></tr></thead>
        <tbody id="lista"></tbody>
      </table></div>
      <button id="csv" class="full">Descargar listado (CSV)</button>
    </section>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, writeBatch, collection, query, where, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Pega aquí los datos de tu app web de Firebase (Configuración del proyecto > Tus apps).
// Son públicos: la seguridad la dan las reglas de firestore.rules.
const firebaseConfig = {
  apiKey: "AIzaSyDWel3IHY5gSdANqQWKDm28qY1gtTmdNCg",
  authDomain: "reservas-de-piscina.firebaseapp.com",
  projectId: "reservas-de-piscina",
  appId: "1:41631638746:web:691cde4fba43c697a031e3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmt = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const rango = h => pad(h) + ":00 a " + pad(h + 1) + ":00";
let registro = false, registrando = false, user = null, perfil = null, esAdmin = false;
let ocupadas = [], todas = [], mias = [], bajas = [];

function aviso(el, texto, ok) { el.textContent = texto; el.className = "msg" + (ok ? " ok" : ""); }
function errorAuth(e) {
  const m = {
    "auth/email-already-in-use": "Ese correo ya tiene una cuenta. Usa Ingresar.",
    "auth/invalid-credential": "Correo o contraseña incorrectos.",
    "auth/invalid-email": "El correo no es válido.",
    "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
    "auth/too-many-requests": "Demasiados intentos. Espera unos minutos."
  };
  return m[e.code] || "No se pudo completar: " + (e.code || e.message);
}

$("modo").onclick = () => {
  registro = !registro;
  $("extra").classList.toggle("hidden", !registro);
  $("go").textContent = registro ? "Crear cuenta" : "Ingresar";
  $("modo").textContent = registro ? "Ya tengo cuenta" : "¿Primera vez? Crear cuenta";
  aviso($("amsg"), "");
};

$("go").onclick = async () => {
  const email = $("email").value.trim(), password = $("pass").value;
  if (!email || password.length < 6) return aviso($("amsg"), "Escribe tu correo y una contraseña de al menos 6 caracteres.");
  try {
    if (!registro) { await signInWithEmailAndPassword(auth, email, password); return; }
    const nombre = $("nombre").value.trim(), casa = $("casa").value.trim(), alias = $("alias").value.trim();
    if (!nombre || !casa || !alias) return aviso($("amsg"), "Escribe tu nombre, tu casa o apartamento y un alias.");
    registrando = true;
    const c = await createUserWithEmailAndPassword(auth, email, password);
    try {
      await setDoc(doc(db, "users", c.user.uid), { nombre, casa, alias, email: c.user.email });
    } catch (e) { await signOut(auth); throw e; }
    registrando = false;
    await entrar(c.user);
  } catch (e) { registrando = false; aviso($("amsg"), errorAuth(e)); }
};

$("salir").onclick = () => signOut(auth);

function desuscribir() { bajas.forEach(f => f()); bajas = []; }

async function entrar(u) {
  user = u; desuscribir();
  $("auth").classList.toggle("hidden", !!u);
  $("app").classList.toggle("hidden", !u);
  if (!u) return;
  const p = await getDoc(doc(db, "users", u.uid));
  if (!p.exists()) { await signOut(auth); return aviso($("amsg"), "Tu perfil está incompleto. Pide ayuda al administrador."); }
  perfil = p.data();
  esAdmin = (await getDoc(doc(db, "admins", u.uid))).exists();
  $("admin").classList.toggle("hidden", !esAdmin);
  $("quien").textContent = perfil.nombre + " (" + perfil.casa + ")";
  const hoy = new Date(), max = new Date(); max.setDate(max.getDate() + 30);
  $("dia").min = fmt(hoy); $("dia").max = fmt(max);
  if (!$("dia").value) $("dia").value = fmt(hoy);
  suscribir();
}

function suscribir() {
  desuscribir();
  const dia = $("dia").value, fallo = () => aviso($("msg"), "No se pudieron cargar las reservas.");
  bajas.push(onSnapshot(query(collection(db, "ocupacion"), where("fecha", "==", dia)),
    s => { ocupadas = s.docs.map(d => d.data()); pintar(); }, fallo));
  const q = esAdmin
    ? query(collection(db, "reservas"), where("fecha", "==", dia))
    : query(collection(db, "reservas"), where("uid", "==", user.uid), where("fecha", "==", dia));
  bajas.push(onSnapshot(q, s => {
    todas = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.hora - b.hora);
    mias = todas.filter(x => x.uid === user.uid);
    pintar(); if (esAdmin) pintarLista();
  }, fallo));
}

function pintar() {
  const cont = $("slots"); cont.innerHTML = "";
  const hoy = new Date(), esHoy = $("dia").value === fmt(hoy);
  for (let h = 9; h < 18; h++) {
    const o = ocupadas.find(x => x.hora === h), r = mias.find(x => x.hora === h);
    const pasado = $("dia").value < fmt(hoy) || (esHoy && h < hoy.getHours());
    const fila = document.createElement("div");
    fila.className = "slot" + (r ? " mine" : o ? " taken" : "") + (pasado ? " past" : "");
    const t = document.createElement("strong"); t.textContent = rango(h);
    const w = document.createElement("div"); w.className = "who";
    if (r) {
      w.textContent = "Tu reserva ";
      if (!pasado) { const b = document.createElement("button"); b.className = "sec"; b.textContent = "Cancelar"; b.onclick = () => cancelar(r); w.appendChild(b); }
    } else if (o) {
      w.textContent = "Reservada por " + o.alias;
    } else if (pasado) {
      w.textContent = "Horario pasado";
    } else {
      const b = document.createElement("button"); b.textContent = "Reservar"; b.onclick = () => reservar(h); w.appendChild(b);
    }
    fila.append(t, w); cont.appendChild(fila);
  }
}

async function reservar(h) {
  aviso($("msg"), "");
  const f = $("dia").value, id = f + "_" + h, b = writeBatch(db);
  b.set(doc(db, "reservas", id), { uid: user.uid, nombre: perfil.nombre, casa: perfil.casa, email: perfil.email, alias: perfil.alias, fecha: f, hora: h });
  b.set(doc(db, "ocupacion", id), { fecha: f, hora: h, alias: perfil.alias });
  b.set(doc(db, "cupos", user.uid + "_" + f), { uid: user.uid, fecha: f });
  try { await b.commit(); aviso($("msg"), "Reserva confirmada.", true); }
  catch (e) {
    aviso($("msg"), e.code === "permission-denied"
      ? "No se pudo reservar: ese horario ya está tomado, o ya tienes una reserva ese día."
      : "No se pudo reservar: " + e.message);
  }
}

async function cancelar(r) {
  const b = writeBatch(db);
  b.delete(doc(db, "reservas", r.id));
  b.delete(doc(db, "ocupacion", r.id));
  b.delete(doc(db, "cupos", r.uid + "_" + r.fecha));
  try { await b.commit(); aviso($("msg"), "Reserva cancelada.", true); }
  catch (e) { aviso($("msg"), "No se pudo cancelar."); }
}

function pintarLista() {
  const tb = $("lista"); tb.innerHTML = "";
  if (!todas.length) { const td = tb.insertRow().insertCell(); td.colSpan = 6; td.textContent = "Sin reservas este día."; return; }
  for (const r of todas) {
    const tr = tb.insertRow();
    [rango(r.hora), r.nombre, r.casa, r.email || "", r.alias].forEach(v => { tr.insertCell().textContent = v; });
    const b = document.createElement("button"); b.className = "sec"; b.textContent = "Quitar";
    b.onclick = () => { if (confirm("¿Quitar la reserva de " + r.nombre + "?")) cancelar(r); };
    tr.insertCell().appendChild(b);
  }
}

function celda(v) {
  v = String(v ?? "");
  if (/^[=+\-@]/.test(v)) v = "'" + v;            // evita fórmulas al abrir en Excel
  return '"' + v.replace(/"/g, '""') + '"';
}

$("csv").onclick = () => {
  const filas = [["Fecha", "Hora", "Nombre", "Casa", "Correo", "Alias"]];
  todas.forEach(r => filas.push([r.fecha, rango(r.hora), r.nombre, r.casa, r.email, r.alias]));
  const texto = "\uFEFF" + filas.map(f => f.map(celda).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([texto], { type: "text/csv;charset=utf-8" }));
  a.download = "reservas-piscina-" + $("dia").value + ".csv";
  a.click(); URL.revokeObjectURL(a.href);
};

$("dia").onchange = () => { if (user) suscribir(); };
onAuthStateChanged(auth, u => { if (!registrando) entrar(u); });
</script>
</body>
</html>
